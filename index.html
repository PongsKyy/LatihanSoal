<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen Sumatif Genap - Bahasa Inggris Kelas X</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .quiz-container {
            background-color: white; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%; max-width: 800px; padding: 30px;
            max-height: 90vh; overflow-y: auto; overflow-x: hidden;
        }
        .quiz-container::-webkit-scrollbar { width: 8px; }
        .quiz-container::-webkit-scrollbar-thumb { background-color: #764ba2; border-radius: 10px; }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .header h1 { font-size: 1.5rem; color: #4a4a4a; margin: 0; }
        .header p { font-size: 0.9rem; color: #888; margin: 5px 0 0 0; }
        
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .question-number { font-weight: 600; color: #764ba2; font-size: 1.1rem; }
        .question-type { background-color: #e0d4f5; color: #4a2b6e; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        
        .question-text { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.6; white-space: pre-line; }
        .instruction { font-size: 0.85rem; color: #dc3545; margin-bottom: 15px; font-style: italic; font-weight: 600; display: none; }
        
        /* Opsi PG Biasa & Kompleks */
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background-color: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px;
            padding: 12px 15px; font-size: 0.95rem; text-align: left; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: flex-start;
        }
        .option-label { font-weight: 600; margin-right: 10px; min-width: 25px; }
        .option-btn:hover { background-color: #e2e6ea; border-color: #dae0e5; }
        .option-btn.selected { background-color: #e0d4f5; border-color: #764ba2; color: #4a2b6e; font-weight: 600; }
        
        /* UI Tarik Garis (Menjodohkan) */
        .matching-wrapper {
            position: relative; display: flex; justify-content: space-between;
            gap: 20px; margin-bottom: 20px; display: none;
        }
        .match-col { display: flex; flex-direction: column; gap: 15px; width: 45%; z-index: 2; }
        .match-box {
            background: #fff; border: 2px solid #ced4da; border-radius: 8px;
            padding: 12px; font-size: 0.9rem; text-align: center; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .match-box:hover { border-color: #764ba2; }
        .match-box.active { background-color: #e0d4f5; border-color: #764ba2; transform: scale(1.02); }
        .match-box.connected { background-color: #d4edda; border-color: #28a745; color: #155724; }
        
        #match-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* Navigation Buttons */
        .btn-container { display: flex; gap: 15px; margin-top: 20px; }
        .prev-btn, .next-btn {
            color: white; border: none; border-radius: 8px;
            padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
            width: 100%; transition: background 0.3s;
        }
        .prev-btn { background-color: #6c757d; }
        .prev-btn:hover { background-color: #5a6268; }
        .prev-btn:disabled { background-color: #e2e6ea; color: #aab2bd; cursor: not-allowed; }
        .next-btn { background-color: #764ba2; }
        .next-btn:hover { background-color: #5f3c82; }
        
        .result-container { text-align: center; display: none; }
        .result-container h2 { font-size: 2rem; color: #764ba2; margin-bottom: 5px; }
        #score-message { font-size: 1.1rem; font-weight: 600; color: #555; margin-bottom: 20px; }
        .review-section { text-align: left; margin-top: 20px; border-top: 2px solid #f0f0f0; padding-top: 20px; }
        .review-item { background-color: #fcfcfc; border: 1px solid #eaeaea; border-left: 4px solid #dc3545; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .review-item.correct-item { border-left-color: #28a745; }
        .review-q { font-weight: 600; margin-bottom: 10px; font-size: 0.95rem; }
        .review-ans { font-size: 0.9rem; margin: 5px 0; }
        .wrong-ans { color: #dc3545; font-weight: 600; }
        .correct-ans { color: #28a745; font-weight: 600; }
        .restart-btn { background-color: #667eea; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>Latihan Sumatif Genap</h1>
            <p>Audita Budianti Comell</p>
        </div>

        <div id="question-area">
            <div class="question-header">
                <div class="question-number" id="q-number">Soal 1 / 30</div>
                <div class="question-type" id="q-type">Pilihan Ganda</div>
            </div>
            <div class="question-text" id="q-text">Pertanyaan akan muncul di sini...</div>
            <div class="instruction" id="q-instruction">*Pilih lebih dari satu jawaban yang benar!</div>
            
            <div class="options-container" id="options"></div>

            <div class="matching-wrapper" id="matching-ui">
                <svg id="match-svg"></svg>
                <div class="match-col" id="left-match-col"></div>
                <div class="match-col" id="right-match-col"></div>
            </div>

            <div class="btn-container">
                <button class="prev-btn" id="prev-btn" onclick="prevQuestion()">Kembali</button>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
            </div>
        </div>

        <div class="result-container" id="result-area">
            <h2>Kuis Selesai! 🎉</h2>
            <p>Skor Akhir Kamu:</p>
            <h1 id="final-score" style="font-size: 3.5rem; margin: 10px 0; color: #4a2b6e;">0 / 30</h1>
            <p id="score-message">Kerja bagus!</p>
            <div class="review-section" id="review-section"></div>
            <button class="restart-btn" onclick="restartQuiz()">Coba Lagi</button>
        </div>
    </div>

    <script>
        const quizData = [
            // --- BAGIAN I: Pilihan Ganda Biasa (1-16) ---
            { type: "mcq", qNum: "1", question: "Bacalah teks berikut:\n'Graffiti is often misunderstood as mere vandalism. However, it is a valid form of urban art that allows individuals to express their creativity and address social issues. Furthermore, urban art can transform dull, gray walls into vibrant masterpieces, bringing life and culture to neglected neighborhoods. Therefore, city councils should provide legal spaces or walls for these artists to channel their talents constructively.'\n\nWhat is the author's position regarding graffiti in the text?", options: ["It should be strictly banned from all cities.", "It is purely a destructive act of vandalism.", "It is a valid form of art and expression.", "It is only suitable for professional painters.", "It has no connection to real social issues."], answer: 2 },
            { type: "mcq", qNum: "2", question: "(Teks yang sama dengan soal No. 1)\n\nWhat implicit information can be inferred about street artists based on the text?", options: ["They intend to destroy public infrastructure.", "They use their art to communicate important messages.", "They are fully funded by the local government.", "They only paint at night to avoid security.", "They avoid painting in neglected neighborhoods."], answer: 1 },
            { type: "mcq", qNum: "3", question: "(Teks yang sama dengan soal No. 1)\n\nWhat is the main benefit of urban art mentioned in the text?", options: ["It decreases the value of properties.", "It increases the crime rate in the city.", "It brings color, life, and culture to neglected areas.", "It makes the urban walls look dirtier and chaotic.", "It makes the city walls structurally stronger."], answer: 2 },
            { type: "mcq", qNum: "4", question: "(Teks yang sama dengan soal No. 1)\n\nWhat does the author recommend to city councils?", options: ["To strictly arrest all street artists.", "To ban the sale of spray paints.", "To provide legal spaces for artists to paint.", "To clean all the graffiti in the city immediately.", "To tax the artists heavily for their paintings."], answer: 2 },
            { type: "mcq", qNum: "5", question: "(Teks yang sama dengan soal No. 1)\n\n'...transform dull, gray walls into VIBRANT masterpieces...' The synonym of the capitalized word is...", options: ["Boring", "Dark", "Damaged", "Colorful", "Plain"], answer: 3 },
            { type: "mcq", qNum: "6", question: "Bacalah teks berikut:\n'Water is essential for our bodies. Staying hydrated ensures that our bodily functions run smoothly. When you do not drink enough water, dehydration occurs, leading to severe headaches, extreme fatigue, and a lack of concentration. Inside our organs, water acts as a transport system, distributing vital nutrients and oxygen to cells while flushing out toxins. Therefore, drinking water is crucial for overall health.'\n\nWhat is the main purpose of the text about Hydration?", options: ["To explain the chemical elements of water.", "To persuade the readers to stay hydrated.", "To describe different types of healthy beverages.", "To argue that water is dangerous in large amounts.", "To compare the benefits of water and sports drinks."], answer: 1 },
            { type: "mcq", qNum: "7", question: "(Teks yang sama dengan soal No. 6)\n\nAccording to the text, what is the direct impact of dehydration?", options: ["Headaches, fatigue, and poor concentration.", "Increased energy and intense focus.", "Better digestion and clearer skin.", "Stronger bones and muscle growth.", "Improved kidney and liver function."], answer: 0 },
            { type: "mcq", qNum: "8", question: "(Teks yang sama dengan soal No. 6)\n\nHow does water function inside our organs?", options: ["It blocks blood flow to rest the heart.", "It replaces the function of stomach acid.", "It stops cells from absorbing complex vitamins.", "It solidifies the blood vessels.", "It transports nutrients, oxygen, and removes toxins."], answer: 4 },
            { type: "mcq", qNum: "9", question: "(Teks yang sama dengan soal No. 6)\n\nWhat is the most appropriate conclusion of the hydration text?", options: ["Water is only necessary for professional athletes.", "Dehydration has no real impact on daily activities.", "Other beverages are far more effective than water.", "Drinking water is crucial for maintaining bodily functions.", "Water should only be consumed when feeling extremely thirsty."], answer: 3 },
            { type: "mcq", qNum: "10", question: "Complete the sentence: 'Physical education is vital in schools _____ it helps students maintain their physical fitness.'", options: ["therefore", "because", "as a result", "consequently", "nevertheless"], answer: 1 },
            { type: "mcq", qNum: "11", question: "'Many students spend hours sitting in front of screens; consequently, they develop poor posture.' Which word functions as the effect marker?", options: ["Many students", "spend hours", "sitting", "consequently", "poor posture"], answer: 3 },
            { type: "mcq", qNum: "12", question: "'The school built a new sports hall. _____, more students are participating in indoor sports.' The correct result conjunction is...", options: ["Because of", "Since", "Due to", "Therefore", "However"], answer: 3 },
            { type: "mcq", qNum: "13", question: "'Due to the heavy rain, the outdoor PE class was cancelled.' The phrase 'Due to' is used to...", options: ["introduce the effect or result.", "show a contrast between two ideas.", "introduce the cause or reason.", "add more information to the sentence.", "summarize the main idea."], answer: 2 },
            { type: "mcq", qNum: "14", question: "Students feel more energized in class _____ engaging in morning exercises.", options: ["because of", "therefore", "so", "because", "despite"], answer: 0 },
            { type: "mcq", qNum: "15", question: "Bacalah teks berikut:\n'Solar energy is considered a clean power source. Sunlight is absorbed by solar panels and then converted into electricity.'\n\nWhich of the following is a Passive Voice sentence?", options: ["People use solar panels today.", "Sunlight shines brightly every day.", "Solar energy provides power to homes.", "Sunlight is absorbed by solar panels.", "The sun produces a lot of heat."], answer: 3 },
            { type: "mcq", qNum: "16", question: "(Teks yang sama dengan soal No. 15)\n\nWhy is solar energy highly recommended?", options: ["Because it relies heavily on fossil fuels.", "Because it is considered a clean power source.", "Because solar panels are extremely cheap.", "Because it produces a lot of air pollution.", "Because it requires expensive maintenance."], answer: 1 },

            // --- BAGIAN II: Pilihan Ganda Kompleks (17-21) ---
            { type: "complex", qNum: "17", question: "Data:\n'A local street art festival was held last month with a budget of $20,000. The festival attracted 5,000 visitors who spent a total of $50,000 in local businesses. The event also successfully created 50 temporary jobs for the community.'\n\nSebuah festival seni jalanan diselenggarakan dengan anggaran $20,000. Festival menarik 5,000 pengunjung yang menghabiskan total $50,000 di toko lokal, dan menciptakan 50 lapangan kerja. Manakah yang BENAR?", options: ["The festival generated $50,000 for local businesses.", "The budget spent for the festival was higher than the revenue.", "The festival provided 50 employment opportunities.", "Only 50 people attended the street art festival.", "The city lost $20,000."], answer: [0, 2] },
            { type: "complex", qNum: "18", question: "(Data yang sama dengan soal No. 17)\n\nPerubahan positif apa saja yang terjadi akibat fenomena festival tersebut?", options: ["Peningkatan pendapatan bagi toko-toko lokal.", "Penurunan drastis jumlah wisatawan yang datang.", "Terciptanya lapangan kerja sementara bagi warga sekitar.", "Defisit anggaran besar-besaran pada kas pemerintah kota.", "Kenaikan tingkat kriminalitas jalanan."], answer: [0, 2] },
            { type: "complex", qNum: "19", question: "Dari pilihan berikut, manakah yang merupakan struktur Kalimat Pasif (Passive Voice)?", options: ["A local street art festival was held last month.", "The mural was painted beautifully by 10 different artists.", "5,000 visitors attended the cultural event enthusiastically.", "The local stores earned a lot of money during the festival.", "The mayor opened the festival."], answer: [0, 1] },
            { type: "complex", qNum: "20", question: "(Data yang sama dengan soal No. 17)\n\nBerdasarkan data numerik festival, pernyataan matematis mana yang benar?", options: ["Keuntungan bersih (net profit) perputaran ekonomi lokal adalah $30,000.", "Total uang yang dihabiskan pengunjung adalah $20,000.", "Jumlah pengunjung (5000) adalah seratus kali lipat dari jumlah lapangan kerja (50).", "Anggaran festival jauh lebih besar dari uang yang dibelanjakan pengunjung.", "Keuntungan bersih adalah $70,000."], answer: [0, 2] },
            { type: "complex", qNum: "21", question: "(Data yang sama dengan soal No. 17)\n\nDampak apa yang paling dirasakan oleh komunitas lokal dari acara tersebut?", options: ["Kebangkrutan bisnis lokal secara massal.", "Peningkatan aktivitas pariwisata dan sosial.", "Kerusakan parah pada fasilitas umum kota.", "Stimulus ekonomi yang sangat menguntungkan.", "Penurunan minat terhadap seni."], answer: [1, 3] },

            // --- BAGIAN III: Menjodohkan (Tarik Garis) (22-26 digabung) ---
            { 
                type: "matching_lines", 
                qNum: "22-26", 
                question: "Klik kotak Sebab (Kiri) lalu klik pasangan Akibat (Kanan) yang paling logis untuk menarik garis!",
                left: ["Massive deforestation", "Increased use of public transportation", "Installation of solar panels on residential roofs", "Heavy rain poured for three days non-stop", "Drinking at least 8 glasses of water daily"],
                right: ["Reduction in traffic jams and air pollution", "The outdoor PE class was cancelled", "Our bodily functions run smoothly", "Loss of animal habitats and increased risk of floods", "Lower monthly electricity bills for homeowners"],
                answer: {0:3, 1:0, 2:4, 3:1, 4:2} // leftIndex -> rightIndex yang benar
            },

            // --- BAGIAN IV: Benar/Salah (27-30) ---
            { type: "tf", qNum: "27", question: "Antonim (lawan kata) dari kata bahasa Inggris 'Increase' adalah 'Expand'.", options: ["Benar (True)", "Salah (False)"], answer: 1 },
            { type: "tf", qNum: "28", question: "Dalam konteks teks eksposisi, kata 'Benefit' memiliki makna yang sejalan (sinonim) dengan 'Advantage' dan berlawanan (antonim) dengan 'Drawback'.", options: ["Benar (True)", "Salah (False)"], answer: 0 },
            { type: "tf", qNum: "29", question: "Pada kalimat 'The highway was closed due to the severe accident', penggunaan kata 'due to' sudah tepat karena diikuti oleh noun phrase.", options: ["Benar (True)", "Salah (False)"], answer: 0 },
            { type: "tf", qNum: "30", question: "Pada kalimat 'It started to rain heavily, because we decided to cancel the outdoor graffiti workshop', penggunaan konjungsi 'because' sudah tepat untuk menunjukkan hasil.", options: ["Benar (True)", "Salah (False)"], answer: 1 }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;
        const labels = ['A', 'B', 'C', 'D', 'E'];

        // Variables for matching line logic
        let selectedLeftMatch = null;
        let matchConnections = {}; // menyimpan jawaban user {leftIndex: rightIndex}

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById('q-number').innerText = `Soal ${q.qNum} / 30`;
            document.getElementById('q-text').innerText = q.question;
            
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            
            // Atur tombol navigasi agar user bisa skip soal
            nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? "Selesaikan Kuis" : "Selanjutnya";
            prevBtn.disabled = currentQuestionIndex === 0;
            
            const typeLabel = document.getElementById('q-type');
            const instruction = document.getElementById('q-instruction');
            const optionsContainer = document.getElementById('options');
            const matchingUI = document.getElementById('matching-ui');
            
            // Reset UI
            optionsContainer.innerHTML = '';
            optionsContainer.style.display = 'none';
            matchingUI.style.display = 'none';
            instruction.style.display = "none";

            if (q.type === "matching_lines") {
                typeLabel.innerText = "Menjodohkan (Tarik Garis)";
                instruction.style.display = "block";
                instruction.innerText = "*Pilih 5 pasangan yang benar!";
                matchingUI.style.display = 'flex';
                setupMatchingUI(q);
            } else {
                optionsContainer.style.display = 'flex';
                if (q.type === "mcq") typeLabel.innerText = "Pilihan Ganda";
                else if (q.type === "complex") {
                    typeLabel.innerText = "PG Kompleks";
                    instruction.style.display = "block";
                    instruction.innerText = "*Pilih lebih dari satu jawaban yang benar!";
                    if(!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
                } else if (q.type === "tf") typeLabel.innerText = "Benar / Salah";

                // Generate Options Button
                q.options.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.classList.add('option-btn');
                    if (q.type === "tf") btn.innerHTML = `<span>${optText}</span>`;
                    else btn.innerHTML = `<span class="option-label">${labels[index]}.</span> <span>${optText}</span>`;

                    if (q.type === "complex") {
                        if (userAnswers[currentQuestionIndex] && userAnswers[currentQuestionIndex].includes(index)) {
                            btn.classList.add('selected');
                        }
                    } else {
                        if (userAnswers[currentQuestionIndex] === index) {
                            btn.classList.add('selected');
                        }
                    }
                    btn.onclick = () => selectAnswer(index, q.type, btn);
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectAnswer(index, type, btnElement) {
            const allBtns = document.getElementById('options').querySelectorAll('.option-btn');
            if (type === "complex") {
                const ansArray = userAnswers[currentQuestionIndex];
                const i = ansArray.indexOf(index);
                if (i > -1) { ansArray.splice(i, 1); btnElement.classList.remove('selected'); }
                else { ansArray.push(index); btnElement.classList.add('selected'); }
            } else {
                userAnswers[currentQuestionIndex] = index;
                allBtns.forEach(b => b.classList.remove('selected'));
                btnElement.classList.add('selected');
            }
        }

        // --- MATCHING LINE LOGIC ---
        function setupMatchingUI(q) {
            const leftCol = document.getElementById('left-match-col');
            const rightCol = document.getElementById('right-match-col');
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            
            // Inisialisasi state jika baru pertama load
            if(!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = {};
            matchConnections = userAnswers[currentQuestionIndex];
            selectedLeftMatch = null;

            q.left.forEach((text, i) => {
                const box = document.createElement('div');
                box.className = 'match-box left-box';
                box.id = `left-box-${i}`;
                box.innerText = text;
                if(matchConnections[i] !== undefined) box.classList.add('connected');
                box.onclick = () => handleLeftClick(i);
                leftCol.appendChild(box);
            });

            q.right.forEach((text, i) => {
                const box = document.createElement('div');
                box.className = 'match-box right-box';
                box.id = `right-box-${i}`;
                box.innerText = text;
                // cek apakah right box ini sudah terkoneksi
                if(Object.values(matchConnections).includes(i)) box.classList.add('connected');
                box.onclick = () => handleRightClick(i);
                rightCol.appendChild(box);
            });

            setTimeout(drawLines, 50); // Delay dikit agar DOM render dulu
        }

        function handleLeftClick(index) {
            document.querySelectorAll('.left-box').forEach(b => b.classList.remove('active'));
            selectedLeftMatch = index;
            document.getElementById(`left-box-${index}`).classList.add('active');
        }

        function handleRightClick(index) {
            if (selectedLeftMatch === null) return; // Harus klik kiri dulu
            
            // Hapus koneksi lama jika kotak kanan ini sudah dipakai
            for (let key in matchConnections) {
                if (matchConnections[key] === index) delete matchConnections[key];
            }
            
            matchConnections[selectedLeftMatch] = index;
            userAnswers[currentQuestionIndex] = matchConnections;
            
            selectedLeftMatch = null;
            document.querySelectorAll('.left-box').forEach(b => {
                b.classList.remove('active');
                if(matchConnections[b.id.split('-')[2]] !== undefined) b.classList.add('connected');
                else b.classList.remove('connected');
            });
            document.querySelectorAll('.right-box').forEach(b => {
                if(Object.values(matchConnections).includes(parseInt(b.id.split('-')[2]))) b.classList.add('connected');
                else b.classList.remove('connected');
            });
            
            drawLines();
        }

        function drawLines() {
            const svg = document.getElementById('match-svg');
            if(!svg) return;
            svg.innerHTML = '';
            const wrapperRect = document.getElementById('matching-ui').getBoundingClientRect();

            for (let leftIndex in matchConnections) {
                const rightIndex = matchConnections[leftIndex];
                const leftBox = document.getElementById(`left-box-${leftIndex}`);
                const rightBox = document.getElementById(`right-box-${rightIndex}`);
                
                if (leftBox && rightBox) {
                    const lRect = leftBox.getBoundingClientRect();
                    const rRect = rightBox.getBoundingClientRect();
                    
                    const x1 = lRect.right - wrapperRect.left;
                    const y1 = lRect.top + lRect.height/2 - wrapperRect.top;
                    const x2 = rRect.left - wrapperRect.left;
                    const y2 = rRect.top + rRect.height/2 - wrapperRect.top;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('stroke', '#28a745'); line.setAttribute('stroke-width', '3');
                    svg.appendChild(line);
                }
            }
        }

        // Gambar ulang garis jika ukuran layar berubah (responsif)
        window.addEventListener('resize', () => {
            if (quizData[currentQuestionIndex].type === 'matching_lines') drawLines();
        });
        // -----------------------------

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function arraysEqual(a, b) {
            if (!a || !b) return false;
            if (a.length !== b.length) return false;
            let sortedA = [...a].sort(), sortedB = [...b].sort();
            for (let i = 0; i < sortedA.length; ++i) { if (sortedA[i] !== sortedB[i]) return false; }
            return true;
        }

        function showResult() {
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            const reviewSection = document.getElementById('review-section');
            reviewSection.innerHTML = '<h3>Detail Jawaban Kamu:</h3>';
            
            score = 0;

            quizData.forEach((q, index) => {
                const uAns = userAnswers[index];
                
                // --- REVIEW UNTUK MATCHING (TARIK GARIS) ---
                if (q.type === "matching_lines") {
                    let matchingScore = 0;
                    let detailHTML = `<div class="review-q">Soal ${q.qNum}: Menjodohkan</div>`;
                    
                    for(let i=0; i<5; i++) {
                        let isPairCorrect = uAns && uAns[i] === q.answer[i];
                        if(isPairCorrect) { matchingScore++; score++; }
                        
                        let userAnsText = (uAns && uAns[i] !== undefined) ? q.right[uAns[i]] : "Kosong";
                        let correctAnsText = q.right[q.answer[i]];
                        
                        detailHTML += `
                            <div style="margin-bottom: 8px; font-size: 0.9rem;">
                                <b>Sebab:</b> ${q.left[i]} <br>
                                <b>Akibat Kamu:</b> <span class="${isPairCorrect ? 'correct-ans' : 'wrong-ans'}">${userAnsText} ${isPairCorrect ? '✅' : '❌'}</span><br>
                                ${!isPairCorrect ? `<b>Jawaban Benar:</b> <span class="correct-ans">${correctAnsText}</span>` : ''}
                            </div>
                            <hr style="border: 0.5px solid #eee;">
                        `;
                    }
                    
                    const item = document.createElement('div');
                    item.className = `review-item ${matchingScore === 5 ? 'correct-item' : ''}`;
                    item.innerHTML = detailHTML;
                    reviewSection.appendChild(item);
                    return; // Lanjut ke iterasi soal berikutnya
                }

                // --- REVIEW UNTUK SOAL LAINNYA ---
                let isCorrect = false;
                let userText = "", correctText = "";

                if (q.type === "complex") {
                    isCorrect = arraysEqual(uAns, q.answer);
                    userText = uAns && uAns.length > 0 ? uAns.sort().map(i => `${labels[i]}`).join(', ') : "Tidak dijawab";
                    correctText = q.answer.sort().map(i => `${labels[i]}`).join(', ');
                } else {
                    isCorrect = uAns === q.answer;
                    if (q.type === "tf") {
                        userText = uAns !== null ? q.options[uAns] : "Tidak dijawab";
                        correctText = q.options[q.answer];
                    } else {
                        userText = uAns !== null ? `${labels[uAns]}` : "Tidak dijawab";
                        correctText = `${labels[q.answer]}`;
                    }
                }

                if (isCorrect) score++;

                const item = document.createElement('div');
                item.className = `review-item ${isCorrect ? 'correct-item' : ''}`;
                item.innerHTML = `
                    <div class="review-q">Soal ${q.qNum}. ${q.question}</div>
                    <div class="review-ans">Jawaban Kamu: <span class="${isCorrect ? 'correct-ans' : 'wrong-ans'}">${userText} ${isCorrect ? '✅' : '❌'}</span></div>
                    ${!isCorrect ? `<div class="review-ans">Jawaban Benar: <span class="correct-ans">${correctText}</span></div>` : ''}
                `;
                reviewSection.appendChild(item);
            });

            document.getElementById('final-score').innerText = `${score} / 30`;
            const msgEl = document.getElementById('score-message');
            
            if (score === 30) msgEl.innerText = "Sempurna! Kamu menjawab semua dengan benar! 🌟";
            else if (score >= 20) msgEl.innerText = "Bagus sekali! Hampir sempurna. 👍";
            else msgEl.innerText = "Tetap semangat! Pelajari lagi dari koreksi di bawah ini. 💪";
            
            window.scrollTo(0, 0);
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            score = 0;
            document.getElementById('question-area').style.display = 'block';
            document.getElementById('result-area').style.display = 'none';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
